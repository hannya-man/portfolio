<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="felt" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#14532d"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2a0505" flood-opacity="0.45"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <g id="chip">
      <circle r="18" fill="currentColor"/>
      <circle r="18" fill="none" stroke="#ffffff" stroke-width="5" stroke-dasharray="7 7.1"/>
      <circle r="10" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="700" cy="440" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="90" cy="60" r="120" fill="#ffffff" opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="100" y="64" width="600" height="400" rx="16" fill="#14532d"/>
  </g>
  <path d="M100 100h600v348a16 16 0 0 1-16 16H116a16 16 0 0 1-16-16z" fill="url(#felt)"/>
  <path d="M100 80a16 16 0 0 1 16-16h568a16 16 0 0 1 16 16v20H100z" fill="#f4f1ea"/>
  <circle cx="124" cy="82" r="6" fill="#ff5f57"/>
  <circle cx="144" cy="82" r="6" fill="#febc2e"/>
  <circle cx="164" cy="82" r="6" fill="#28c840"/>
  <rect x="300" y="74" width="200" height="16" rx="8" fill="#e6e0d3"/>

  <ellipse cx="400" cy="240" rx="250" ry="120" fill="none" stroke="#fde68a" stroke-opacity="0.35" stroke-width="2"/>

  <!-- fanned hand: K K K 7 7 (full house) -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" filter="url(#card)">
    <g transform="rotate(-16 400 470)">
      <rect x="364" y="146" width="72" height="104" rx="8" fill="#ffffff"/>
      <text x="374" y="170" font-size="18" fill="#111827">K</text>
      <text x="400" y="214" font-size="34" fill="#111827" text-anchor="middle">♠</text>
    </g>
    <g transform="rotate(-8 400 470)">
      <rect x="364" y="146" width="72" height="104" rx="8" fill="#ffffff"/>
      <text x="374" y="170" font-size="18" fill="#dc2626">K</text>
      <text x="400" y="214" font-size="34" fill="#dc2626" text-anchor="middle">♥</text>
    </g>
    <g>
      <rect x="364" y="146" width="72" height="104" rx="8" fill="#ffffff"/>
      <text x="374" y="170" font-size="18" fill="#dc2626">K</text>
      <text x="400" y="214" font-size="34" fill="#dc2626" text-anchor="middle">♦</text>
    </g>
    <g transform="rotate(8 400 470)">
      <rect x="364" y="146" width="72" height="104" rx="8" fill="#ffffff"/>
      <text x="374" y="170" font-size="18" fill="#111827">7</text>
      <text x="400" y="214" font-size="34" fill="#111827" text-anchor="middle">♣</text>
    </g>
    <g transform="rotate(16 400 470)">
      <rect x="364" y="146" width="72" height="104" rx="8" fill="#ffffff"/>
      <text x="374" y="170" font-size="18" fill="#111827">7</text>
      <text x="400" y="214" font-size="34" fill="#111827" text-anchor="middle">♠</text>
    </g>
  </g>

  <!-- prediction -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="300" y="282" width="200" height="40" rx="20" fill="#0b1f14" opacity="0.85"/>
    <text x="400" y="308" font-size="16" font-weight="800" fill="#facc15" text-anchor="middle" letter-spacing="1.5">FULL HOUSE</text>

    <rect x="214" y="340" width="372" height="100" rx="12" fill="#0b1f14" opacity="0.6"/>
    <g font-size="12" font-weight="600" fill="#d1fae5">
      <text x="232" y="366">Full house</text>
      <text x="232" y="391">Three of a kind</text>
      <text x="232" y="416">Two pair</text>
    </g>
    <rect x="344" y="357" width="180" height="10" rx="5" fill="#1f3d2c"/>
    <rect x="344" y="357" width="172" height="10" rx="5" fill="#facc15"/>
    <rect x="344" y="382" width="180" height="10" rx="5" fill="#1f3d2c"/>
    <rect x="344" y="382" width="12" height="10" rx="5" fill="#86efac"/>
    <rect x="344" y="407" width="180" height="10" rx="5" fill="#1f3d2c"/>
    <rect x="344" y="407" width="6" height="10" rx="3" fill="#86efac"/>
    <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="end">
      <text x="572" y="367">96%</text>
      <text x="572" y="392">3%</text>
      <text x="572" y="417">1%</text>
    </g>
  </g>

  <!-- chips -->
  <use href="#chip" x="160" y="400" color="#dc2626"/>
  <use href="#chip" x="172" y="384" color="#2563eb"/>
  <use href="#chip" x="640" y="160" color="#111827"/>
  <use href="#chip" x="652" y="142" color="#dc2626"/>
</svg>
