    <text x="566" y="212" font-size="22" fill="#e2e8f0">300</text>
    <rect x="566" y="224" width="80" height="6" rx="3" fill="#24304f"/>

    <rect x="416" y="258" width="124" height="86" rx="10" fill="#121a30" stroke="#4ade80"/>
