    <text x="140" y="188"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> nc lair.ctf 1337</tspan></text>
    <text x="140" y="212" fill="#a78bfa">&gt; Welcome to Hyo's Lair</text>
    <text x="140" y="236" fill="#64748b">&gt; challenge: who_owns_this</text>
    <text x="140" y="270"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> exiftool clue.jpg</tspan></text>
    <text x="140" y="294" fill="#94a3b8">GPS Position : 8.15 N</text>
    <text x="140" y="328"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> strings crackme</tspan></text>
    <text x="140" y="352" fill="#94a3b8">  | grep flag</text>
    <rect x="136" y="368" width="220" height="28" rx="6" fill="#facc15" opacity="0.12"/>
    <text x="146" y="387" fill="#facc15" font-weight="700">flag{0s1nt_1s_fun}</text>
    <text x="140" y="424"><tspan fill="#4ade80">$</tspan></text>
    <rect x="154" y="413" width="9" height="15" fill="#e2e8f0"/>
  </g>

