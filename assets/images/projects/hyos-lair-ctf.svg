    <rect x="566" y="324" width="74" height="6" rx="3" fill="#24304f"/>

    <rect x="416" y="358" width="260" height="86" rx="10" fill="#121a30" stroke="#24304f"/>
    <text x="430" y="384" font-size="11" fill="#94a3b8">SCOREBOARD</text>
    <rect x="430" y="398" width="200" height="8" rx="4" fill="#24304f"/>
