<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="680" cy="80" r="110" fill="#a855f7" opacity="0.35" filter="url(#glow)"/>
  <circle cx="110" cy="440" r="110" fill="#22d3ee" opacity="0.25" filter="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="100" y="64" width="600" height="400" rx="16" fill="#0b1020"/>
  </g>
  <path d="M100 80a16 16 0 0 1 16-16h568a16 16 0 0 1 16 16v20H100z" fill="#151b30"/>
  <circle cx="124" cy="82" r="6" fill="#ff5f57"/>
